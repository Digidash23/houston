# TEMPORARY: proves the release cache warm + restore path on a PR. Deleted
# before the PR is ready. Runs the warm workflow on this PR's ref, then a
# restore leg per platform that mirrors release.yml's setup phase up to the
# Tauri build. Nothing is signed, bundled or uploaded.
name: tmp release cache validate

on:
  pull_request:
    paths:
      - .github/workflows/tmp-release-cache-validate.yml
      - .github/workflows/release-cache-warm.yml
      - scripts/ci/install-artifact-signing-cli.sh

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.10"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  warm:
    uses: ./.github/workflows/release-cache-warm.yml

  restore:
    needs: warm
    name: Restore (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macos-universal
            runner: macos-latest
            host-triple: aarch64-apple-darwin
            whisper-bin: target/whisper/whisper-cli-aarch64-apple-darwin
          - leg: windows-x86_64
            runner: windows-latest
            host-triple: x86_64-pc-windows-msvc
            whisper-bin: target/whisper/whisper-cli-x86_64-pc-windows-msvc.exe
          - leg: windows-aarch64
            runner: windows-11-arm
            host-triple: aarch64-pc-windows-msvc
            whisper-bin: target/whisper/whisper-cli-aarch64-pc-windows-msvc.exe
          - leg: linux-x86_64
            runner: ubuntu-latest
            host-triple: x86_64-unknown-linux-gnu
            whisper-bin: target/whisper/whisper-cli-x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      HOST_TRIPLE: ${{ matrix.host-triple }}
      WHISPER_BIN: ${{ matrix.whisper-bin }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Restore artifact-signing-cli (warmed on main)
        id: signing-cli-cache
        if: ${{ runner.os == 'Windows' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/artifact-signing-cli.exe
          key: signing-cli-${{ matrix.leg }}-${{ hashFiles('scripts/ci/install-artifact-signing-cli.sh') }}-${{ steps.toolchain.outputs.cachekey }}
          restore-keys: signing-cli-${{ matrix.leg }}-${{ hashFiles('scripts/ci/install-artifact-signing-cli.sh') }}-

      - name: Read runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore whisper-cli (warmed on main)
        id: whisper-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/whisper/
          key: whisper-cli-${{ matrix.leg }}-${{ hashFiles('scripts/build-whisper.sh') }}-${{ steps.image.outputs.version }}
          restore-keys: whisper-cli-${{ matrix.leg }}-${{ hashFiles('scripts/build-whisper.sh') }}-

      - name: Install artifact-signing-cli
        id: signing-cli
        if: ${{ runner.os == 'Windows' && steps.signing-cli-cache.outputs.cache-matched-key == '' }}
        background: true
        run: scripts/ci/install-artifact-signing-cli.sh

      - name: Build whisper-cli dictation sidecar
        id: whisper
        if: ${{ steps.whisper-cache.outputs.cache-matched-key == '' }}
        background: true
        run: scripts/build-whisper.sh "$HOST_TRIPLE"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          STORE=$(pnpm store path)
          echo "pnpm store: $STORE"
          echo "path=$STORE" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (warmed on main)
        id: pnpm-cache
        if: ${{ runner.os == 'Windows' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ matrix.leg }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ matrix.leg }}-

      - name: Install dependencies
        run: pnpm install

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Compile Houston host sidecar
        run: scripts/build-host-sidecar.sh "$HOST_TRIPLE"

      - name: Wait for artifact-signing-cli and the whisper-cli build
        wait: [signing-cli, whisper]

      # The point of the run: every restore must have hit, the background
      # builds must have been skipped, and the restored binaries must run.
      - name: Assert every cache hit and the restored binaries run
        env:
          WHISPER_MATCHED: ${{ steps.whisper-cache.outputs.cache-matched-key }}
          SIGNING_MATCHED: ${{ steps.signing-cli-cache.outputs.cache-matched-key }}
          PNPM_MATCHED: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
          WHISPER_BUILT: ${{ steps.whisper.outcome }}
          SIGNING_BUILT: ${{ steps.signing-cli.outcome }}
        run: |
          set -euo pipefail
          echo "whisper matched: ${WHISPER_MATCHED:-<none>} (build step: $WHISPER_BUILT)"
          echo "signing matched: ${SIGNING_MATCHED:-<none>} (install step: $SIGNING_BUILT)"
          echo "pnpm matched:    ${PNPM_MATCHED:-<none>}"
          [ -n "$WHISPER_MATCHED" ] || { echo "::error::whisper-cli cache missed"; exit 1; }
          [ "$WHISPER_BUILT" = "skipped" ] || { echo "::error::whisper-cli build ran despite the cache"; exit 1; }
          test -x "$WHISPER_BIN" || { echo "::error::$WHISPER_BIN missing"; exit 1; }
          ls -la target/whisper/
          "$WHISPER_BIN" --help | head -3
          if [ "$RUNNER_OS" = "Windows" ]; then
            [ -n "$SIGNING_MATCHED" ] || { echo "::error::artifact-signing-cli cache missed"; exit 1; }
            [ "$SIGNING_BUILT" = "skipped" ] || { echo "::error::artifact-signing-cli install ran despite the cache"; exit 1; }
            artifact-signing-cli --help | head -3
            [ -n "$PNPM_MATCHED" ] || { echo "::error::pnpm store cache missed"; exit 1; }
            du -sh "$(pnpm store path)"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            for TRIPLE in aarch64-apple-darwin x86_64-apple-darwin; do
              test -x "target/whisper/whisper-cli-$TRIPLE" || { echo "::error::whisper-cli missing for $TRIPLE"; exit 1; }
            done
            lipo -create target/whisper/whisper-cli-aarch64-apple-darwin target/whisper/whisper-cli-x86_64-apple-darwin -output /tmp/whisper-cli-universal
            lipo -info /tmp/whisper-cli-universal
          fi
